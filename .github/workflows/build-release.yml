name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: true
        type: string
      include_android:
        description: "Include Android bundle"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build Multi-Platform Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify tag exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/${{ inputs.tag }}" --silent 2>/dev/null; then
            echo "::error::Tag '${{ inputs.tag }}' does not exist. Create it first."
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Setup Go from go.mod
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Repair broken pnpm lockfile
        shell: bash
        run: |
          cd web/frontend
          set -e
          echo "Checking frontend dependencies..."
          if ! pnpm install --frozen-lockfile; then
            echo "pnpm lockfile is broken or invalid; regenerating..."
            rm -f pnpm-lock.yaml
            pnpm install
          fi

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Run GoReleaser (build only)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: build --clean --snapshot
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GOVERSION: ${{ steps.setup-go.outputs.go-version }}
          INCLUDE_ANDROID_BUNDLE: ${{ inputs.include_android }}

      - name: Package artifacts by platform
        shell: bash
        run: |
          mkdir -p final-artifacts
          
          # GoReleaser 输出在 dist/ 目录下，按平台+架构组织
          cd dist
          
          # 获取所有不同的平台-架构组合
          declare -A packages
          
          for file in *; do
            # 跳过目录和非二进制文件（除了已是 tar.gz 或 zip 的）
            if [ -f "$file" ]; then
              # 提取平台信息（Linux_x86_64, Windows_x86_64, Darwin_arm64 等）
              if [[ $file =~ ^picoclaw-launcher_([^_]+)_(.+)$ ]]; then
                platform="${BASH_REMATCH[1]}"
                arch_variant="${BASH_REMATCH[2]}"
                key="${platform}_${arch_variant}"
                packages["$key"]+="$file "
              elif [[ $file =~ ^picoclaw_([^_]+)_(.+)$ ]]; then
                platform="${BASH_REMATCH[1]}"
                arch_variant="${BASH_REMATCH[2]}"
                key="${platform}_${arch_variant}"
                packages["$key"]+="$file "
              fi
            fi
          done
          
          # 为每个平台-架构组合创建压缩包
          for key in "${!packages[@]}"; do
            files=(${packages[$key]})
            
            # 确定压缩格式：Windows 用 zip，其他用 tar.gz
            if [[ $key == *"Windows"* ]]; then
              archive_name="picoclaw_${{ inputs.tag }}_${key}.zip"
              zip -q "../final-artifacts/$archive_name" ${files[@]}
            else
              archive_name="picoclaw_${{ inputs.tag }}_${key}.tar.gz"
              tar czf "../final-artifacts/$archive_name" ${files[@]}
            fi
            
            echo "Created: $archive_name"
          done
          
          cd ..
          
          # 处理预构建的归档文件（tar.gz 和 zip）- 直接复制
          if [ -d "dist" ]; then
            for archive in dist/*.tar.gz dist/*.zip; do
              if [ -f "$archive" ]; then
                filename=$(basename "$archive")
                cp "$archive" "final-artifacts/picoclaw_${{ inputs.tag }}_${filename%.*}.${filename##*.}"
                echo "Copied: $(basename $archive)"
              fi
            done
          fi
          
          # 处理 Android 包（如果存在）
          if [ -f "build/picoclaw-android-universal.zip" ]; then
            cp "build/picoclaw-android-universal.zip" "final-artifacts/picoclaw_${{ inputs.tag }}_android-universal.zip"
            echo "Copied: Android universal bundle"
          fi
          
          echo "=== Final Artifacts ==="
          ls -lh final-artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picoclaw-${{ inputs.tag }}-packages
          path: final-artifacts/
          retention-days: 30
